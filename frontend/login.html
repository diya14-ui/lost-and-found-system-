<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Campus Lost and Found</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <h1 class="login-title">Student Login</h1>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email / Username</label>
                    <input type="text" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" spellcheck="false">
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>

                <button type="submit" class="login-btn">Login</button>
                <div id="loginStatus" class="form-status" aria-live="polite"></div>
            </form>

            <div class="login-links">
                <div class="signup-link">
                     Don't have an account? <a href="signup.html">Sign up here</a>
                </div>
                <a href="forgot-password.html" class="forgot-password">Forgot Password?</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const loginPasswordInput = document.getElementById('password');

        loginPasswordInput.addEventListener('copy', (event) => event.preventDefault());
        loginPasswordInput.addEventListener('cut', (event) => event.preventDefault());

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const statusEl = document.getElementById('loginStatus');
            const submitBtn = this.querySelector('.login-btn');
            const originalBtnText = submitBtn.textContent;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            function showStatus(message, type) {
                statusEl.textContent = message;
                statusEl.className = `form-status ${type}`;
            }

            if (!email || !password) {
                showStatus('Please enter email and password.', 'error');
                return;
            }

            showStatus('', '');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            try {
                const response = await apiRequest('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    showStatus(result.message || 'Login failed.', 'error');
                    return;
                }

                setAuthSession(result.data);
                localStorage.setItem('userLoggedIn', 'true');
                showStatus('Login successful. Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'profile.html';
                }, 350);
            } catch (error) {
                showStatus('Could not connect to backend. Please start the API server.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;
            }
        });
    </script>
</body>
</html>
