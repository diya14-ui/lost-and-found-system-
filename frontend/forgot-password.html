<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Campus Lost and Found</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <style>
        .forgot-note {
            margin-top: 14px;
            color: #666;
            font-size: 0.92rem;
            line-height: 1.5;
            text-align: left;
        }

        .reset-link-panel {
            margin-top: 18px;
            padding: 14px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            text-align: left;
            display: none;
        }

        .reset-link-panel.show {
            display: block;
        }

        .reset-link-title {
            margin: 0 0 8px;
            font-size: 1rem;
            color: #111827;
        }

        .reset-link-text {
            margin: 0 0 10px;
            color: #475569;
            font-size: 0.92rem;
        }

        .reset-link-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .reset-link-row a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
            word-break: break-all;
        }

        .reset-link-row a:hover {
            text-decoration: underline;
        }

        .secondary-link {
            display: inline-block;
            margin-top: 14px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .secondary-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <h1 class="login-title" id="pageTitle">Forgot Password</h1>

            <form class="login-form" id="requestForm">
                <div class="form-group">
                    <label for="requestEmail">Email</label>
                    <input type="email" id="requestEmail" name="requestEmail" autocomplete="email" required>
                </div>

                <button type="submit" class="login-btn">Send Reset Link</button>
                <div id="requestStatus" class="form-status" aria-live="polite"></div>
            </form>

            <form class="login-form" id="resetForm" style="display: none;">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required spellcheck="false">
                </div>

                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" name="confirmNewPassword" autocomplete="new-password" required spellcheck="false">
                </div>

                <button type="submit" class="login-btn">Update Password</button>
                <div id="resetStatus" class="form-status" aria-live="polite"></div>
            </form>

            <div id="resetLinkPanel" class="reset-link-panel" aria-live="polite">
                <h3 class="reset-link-title">Reset link created</h3>
                <p class="reset-link-text">Because this app does not send email, the generated reset link is shown here. Open it to continue.</p>
                <div class="reset-link-row">
                    <a id="resetLinkAnchor" href="#">Open reset link</a>
                </div>
            </div>

            <div class="login-links">
                <div class="signup-link">
                    Remembered your password? <a href="login.html">Back to login</a>
                </div>
            </div>

            <p class="forgot-note">
                If the email exists, the system will create a real one-time reset token and store it in the database.
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const pageTitle = document.getElementById('pageTitle');
        const requestForm = document.getElementById('requestForm');
        const resetForm = document.getElementById('resetForm');
        const requestStatus = document.getElementById('requestStatus');
        const resetStatus = document.getElementById('resetStatus');
        const requestEmailInput = document.getElementById('requestEmail');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmNewPasswordInput = document.getElementById('confirmNewPassword');
        const resetLinkPanel = document.getElementById('resetLinkPanel');
        const resetLinkAnchor = document.getElementById('resetLinkAnchor');
        const resetToken = new URLSearchParams(window.location.search).get('token') || '';

        function showStatus(element, message, type) {
            element.textContent = message;
            element.className = `form-status ${type}`;
        }

        function blockPasswordCopying(inputElement) {
            inputElement.addEventListener('copy', (event) => event.preventDefault());
            inputElement.addEventListener('cut', (event) => event.preventDefault());
        }

        blockPasswordCopying(newPasswordInput);
        blockPasswordCopying(confirmNewPasswordInput);

        function showResetMode() {
            pageTitle.textContent = 'Set New Password';
            requestForm.style.display = 'none';
            resetForm.style.display = 'flex';
        }

        if (resetToken) {
            showResetMode();
        }

        requestForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = requestEmailInput.value.trim();
            if (!email) {
                showStatus(requestStatus, 'Please enter your email.', 'error');
                return;
            }

            const submitBtn = requestForm.querySelector('.login-btn');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating link...';
            showStatus(requestStatus, '', '');
            resetLinkPanel.classList.remove('show');

            try {
                const response = await apiRequest('/auth/password-reset/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    showStatus(requestStatus, result.message || 'Could not create reset link.', 'error');
                    return;
                }

                showStatus(requestStatus, result.message || 'Reset link created.', 'success');

                if (result.data && result.data.resetUrl) {
                    const resetUrl = result.data.resetUrl;
                    resetLinkAnchor.href = resetUrl;
                    resetLinkAnchor.textContent = resetUrl;
                    resetLinkPanel.classList.add('show');
                }
            } catch (error) {
                showStatus(requestStatus, 'Could not connect to backend. Please start the API server.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });

        resetForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const newPassword = newPasswordInput.value;
            const confirmNewPassword = confirmNewPasswordInput.value;

            if (!newPassword || !confirmNewPassword) {
                showStatus(resetStatus, 'Please enter and confirm the new password.', 'error');
                return;
            }

            if (newPassword !== confirmNewPassword) {
                showStatus(resetStatus, 'Passwords do not match.', 'error');
                return;
            }

            const submitBtn = resetForm.querySelector('.login-btn');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating...';
            showStatus(resetStatus, '', '');

            try {
                const response = await apiRequest('/auth/password-reset/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, newPassword })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    showStatus(resetStatus, result.message || 'Could not update password.', 'error');
                    return;
                }

                showStatus(resetStatus, 'Password updated successfully. Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 900);
            } catch (error) {
                showStatus(resetStatus, 'Could not connect to backend. Please start the API server.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
