<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>signup page - Campus Lost and Found</title>
</head>
<body>
    <div class="signup-container">
    <h2>Create Account</h2>
    <p class="subtitle">Join the Lost & Found System</p>

    <form>
        <div class="input-field">
            <input type="text" placeholder=" " required />
            <label>Name</label>
        </div>

        <div class="input-field">
            <input type="email" placeholder=" " required />
            <label>Email</label>
        </div>

        <div class="input-field">
            <input type="text" placeholder=" " required />
            <label>Student ID</label>
        </div>

        <div class="input-field">
            <input type="password" placeholder=" " required />
            <label>Password</label>
        </div>

        <div class="input-field">
            <input type="password" placeholder=" " required />
            <label>Confirm Password</label>
        </div>

        <label class="upload-label">Upload Profile Photo (optional)</label>
        <input type="file" accept="image/*" style="margin-bottom: 20px;" />

        <button type="submit" class="button">Sign Up</button>
    </form>

    <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
</div>


</body>
</html>
